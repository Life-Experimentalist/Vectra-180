<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%" role="img" aria-label="Vectra-180 — dual-fisheye dashcam for the Raspberry Pi Compute Module 5">
  <title>Vectra-180</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E2640" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- The sweep is a moving highlight, not a moving shape: a gradient with a
         narrow bright band, translated across the artwork. One paint, no
         layout, and it stays crisp at any width the README renders it at. -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="35%"  stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%"  stop-color="#00F2FE" stop-opacity="0.10" />
      <stop offset="65%"  stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="800" height="260" rx="16" />
    </clipPath>
  </defs>

  <style>
    /* Motion is decoration here -- every shape below is drawn in its resting
       position, so a reader who has asked their system for less of it loses
       nothing but the movement. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

    .ring-l   { animation: spin 26s linear infinite; transform-origin: 70px 90px; }
    .ring-r   { animation: spin 26s linear infinite reverse; transform-origin: 150px 90px; }
    .core     { animation: pulse 2.6s ease-in-out infinite; }
    .core-r   { animation-delay: 1.3s; }
    .iris     { animation: breathe 4.2s ease-in-out infinite; }
    .iris-r   { animation-delay: 2.1s; }
    /* A pulse running along the vector, over a path that is always fully
       drawn. Tracing the path itself would leave the triangle broken for most
       of the cycle, and a logo caught mid-stroke just reads as a rendering
       fault. */
    .spark    { stroke-dasharray: 26 274; animation: run 4.4s linear infinite; }
    .horizon  { animation: drift 7s linear infinite; }
    .sweep    { animation: sweep 9s cubic-bezier(.5,0,.5,1) infinite; }
    .rule-dot { animation: pulse 2.6s ease-in-out infinite; animation-delay: .8s; }
    .tag      { animation: flicker 5.5s ease-in-out infinite; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%,100% { opacity: 1;  } 50% { opacity: .45; } }
    @keyframes breathe { 0%,100% { opacity: .85; } 50% { opacity: .45; } }
    @keyframes run     { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
    @keyframes drift   { to { stroke-dashoffset: -16; } }
    @keyframes sweep   { 0%   { transform: translateX(-900px); }
                         55%  { transform: translateX(900px);  }
                         100% { transform: translateX(900px);  } }
    @keyframes flicker { 0%,100% { opacity: .75; } 50% { opacity: .45; } }
  </style>

  <rect width="800" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="798" height="258" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Dual sensor and depth vector -->
  <g transform="translate(60, 40)">
    <circle class="ring-l" cx="70" cy="90" r="50" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 4" />
    <circle class="iris" cx="70" cy="90" r="35" fill="none" stroke="url(#cyanGrad)" stroke-width="4" />
    <circle class="core" cx="70" cy="90" r="8" fill="#00F2FE" filter="url(#glow)" />

    <circle class="ring-r" cx="150" cy="90" r="50" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 4" />
    <circle class="iris iris-r" cx="150" cy="90" r="35" fill="none" stroke="url(#cyanGrad)" stroke-width="4" />
    <circle class="core core-r" cx="150" cy="90" r="8" fill="#00F2FE" filter="url(#glow)" />

    <!-- Triangulation vector: the road, and the depth the two lenses recover -->
    <path d="M 30,150 L 110,40 L 190,150" fill="none" stroke="url(#cyanGrad)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path class="spark" d="M 30,150 L 110,40 L 190,150" fill="none" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M 60,110 L 110,40 L 160,110" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />

    <line class="horizon" x1="20" y1="90" x2="200" y2="90" stroke="#00F2FE" stroke-width="2" opacity="0.4" stroke-dasharray="4 4" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(310, 115)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      VECTRA<tspan fill="url(#cyanGrad)">180</tspan>
    </text>

    <text x="4" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="6">
      DUAL-FISHEYE DASHCAM &#183; PI CM5
    </text>

    <text class="tag" x="4" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#00F2FE">
      [ UVC DUAL FISHEYE // LOOP RECORD // DEPTH ON DEMAND ]
    </text>
  </g>

  <line x1="314" y1="135" x2="720" y2="135" stroke="#334155" stroke-width="1" />
  <circle class="rule-dot" cx="720" cy="135" r="3" fill="#00F2FE" />

  <!-- Scan sweep, clipped to the card so it never spills past the rounded corner -->
  <g clip-path="url(#cardClip)">
    <rect class="sweep" width="800" height="260" fill="url(#sweepGrad)" />
  </g>
</svg>
