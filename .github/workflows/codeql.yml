name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory is found without waiting for the
    # next commit. Monday morning UTC.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended adds the lower-severity checks; this codebase
          # parses binary frames off a USB device and serves HTTP, so both
          # taint paths are worth the extra minutes.
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
