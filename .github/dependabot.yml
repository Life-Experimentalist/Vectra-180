version: 2

updates:
  # uv, not pip: CI runs with UV_FROZEN=1, so a bump to pyproject.toml that
  # leaves uv.lock behind fails the build. The uv ecosystem updates both.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "pre-commit"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # The image has to run an interpreter the test matrix actually covers,
      # and the matrix tops out where the classifiers do. Left alone,
      # Dependabot proposes each new Python the day it is tagged -- which
      # would ship the appliance on a version nothing here has ever run, and
      # ahead of the OpenCV and NumPy wheels it needs. Raise this once the
      # matrix and the classifiers move.
      - dependency-name: "python"
        versions: [">=3.14"]
    labels:
      - "dependencies"
