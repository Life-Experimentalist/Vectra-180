<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Icon Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E2640" />
    </linearGradient>

    <!-- Electric Cyan Sensor Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Icon Container with Modern Rounded Corners -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="93" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Background Optical Grid Lines -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#00F2FE" stroke-width="2" opacity="0.25" stroke-dasharray="8 8" />
  <line x1="256" y1="64" x2="256" y2="448" stroke="#334155" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />

  <!-- ========================================== -->
  <!-- LEFT LENS (Fisheye Sensor 1)              -->
  <!-- ========================================== -->
  <circle cx="180" cy="256" r="100" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="14 8" />
  <circle cx="180" cy="256" r="70" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="180" cy="256" r="14" fill="#00F2FE" filter="url(#glow)" />

  <!-- ========================================== -->
  <!-- RIGHT LENS (Fisheye Sensor 2)             -->
  <!-- ========================================== -->
  <circle cx="332" cy="256" r="100" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="14 8" />
  <circle cx="332" cy="256" r="70" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="332" cy="256" r="14" fill="#00F2FE" filter="url(#glow)" />

  <!-- ========================================== -->
  <!-- DEPTH TRIANGULATION VECTOR (The Road/Apex) -->
  <!-- ========================================== -->
  <!-- Primary Outer Chevron -->
  <path d="M 80,380 L 256,110 L 432,380" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Secondary Inner Echo Vector -->
  <path d="M 134,330 L 256,142 L 378,330" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Baseline Horizon Connector -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.5" stroke-linecap="round" />

  <!-- AI Target Node at Triangulation Apex -->
  <circle cx="256" cy="110" r="18" fill="none" stroke="#00F2FE" stroke-width="3" opacity="0.8" />
  <circle cx="256" cy="110" r="8" fill="#FFFFFF" filter="url(#glow)" />
</svg>
