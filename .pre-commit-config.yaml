# Install with: uv run pre-commit install
#
# ruff and mypy run through `uv run` rather than as pinned mirror repos, so the
# hook, `make gate` and CI are all the same version -- the one in uv.lock. A
# pinned mirror drifts from the lockfile and then the hook passes what CI fails.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      # Recorded footage and build artifacts do not belong in git history, and
      # by the time they are in it, removing them is a rewrite.
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Package hashes are high-entropy strings and always will be.
        exclude: ^uv\.lock$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
